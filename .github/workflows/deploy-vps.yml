# deploy-vps.yml — キャバ帳を AINOWA の共用 XServer VPS へ配備する(画面 + サーバー + SQLite)。
#
# 構成: VPS の /srv/apps/<APP_NAME>/app に「server.js(キャバ帳サーバー)+ public/(画面)」を置き、
#       systemd の app-<APP_NAME> が起動する。nginx は 127.0.0.1:<PORT> へ中継する(add-app.sh の node 構成)。
#       データは /srv/apps/<APP_NAME>/data/kyabacho.db(SQLite)。ログインは Google(サーバーが直接処理)。
#
# 事前準備: Mac で `bash scripts/setup-vps.sh`(docs/デプロイ_VPS.md)
#   Secrets  : VPS_HOST / VPS_PORT / VPS_USER(=deploy)/ VPS_SSH_KEY / VPS_KNOWN_HOSTS(任意)
#   Variables: APP_NAME(=kyabacho)/ APP_URL(例 https://kyabacho.ainowa.net)/ AUTO_DEPLOY(true で main 反映時に自動配備)
#              VITE_ENABLE_AI(true で生成AIの機能を表示。既定は非表示=蓋閉じ)/ BUILD_SCRIPT(任意。既定 build)
#   AI を再開するとき(任意): Secrets VITE_AI_API_KEY / VITE_AI_PROXY_URL、Variables VITE_AI_BASE_URL / VITE_AI_MODEL
#   Google ログインの設定(GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET)は GitHub ではなく VPS の .env に置く。
#
# 配備のタイミング:
#   - 手動実行(Actions → deploy-vps → Run workflow)はいつでも可
#   - main への反映(PR のマージ)で自動配備するのは、Variables の AUTO_DEPLOY が "true" のときだけ。
#     協業ルール上「main へのマージ=本番配備」なので、マージ前の PR レビュー・承認が配備の承認になる。
#     docs/ と *.md だけの変更では配備しない。
name: deploy-vps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

concurrency:
  group: deploy-vps-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.AUTO_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_NAME: ${{ vars.APP_NAME }}
      APP_URL: ${{ vars.APP_URL }}
      BUILD_SCRIPT: ${{ vars.BUILD_SCRIPT || 'build' }}
      OUTPUT_DIR: dist
    steps:
      - name: 設定の確認
        env:
          SEC_HOST: ${{ secrets.VPS_HOST }}
          SEC_USER: ${{ secrets.VPS_USER }}
          SEC_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$APP_NAME" | grep -Eq '^[a-z0-9][a-z0-9-]{0,26}[a-z0-9]$'; then
            echo "::error::Variables の APP_NAME が未設定か形式が不正です(例: kyabacho)"; exit 1
          fi
          case "$BUILD_SCRIPT" in build|build:cast|build:store) ;; *) echo "::error::BUILD_SCRIPT は build / build:cast / build:store のいずれか"; exit 1 ;; esac
          missing=""
          [ -n "$SEC_HOST" ] || missing="$missing VPS_HOST"
          [ -n "$SEC_USER" ] || missing="$missing VPS_USER"
          [ -n "$SEC_KEY" ] || missing="$missing VPS_SSH_KEY"
          [ -z "$missing" ] || { echo "::error::Secrets が未設定です:$missing"; exit 1; }
          echo "配備先: $APP_NAME (node) → /srv/apps/$APP_NAME/app/ / ビルド: npm run $BUILD_SCRIPT"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: サーバーのテスト
        working-directory: server
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test

      - name: ビルド
        env:
          VITE_ENABLE_AI: ${{ vars.VITE_ENABLE_AI || 'false' }}
          AI_API_KEY: ${{ secrets.VITE_AI_API_KEY }}
          AI_PROXY_URL: ${{ secrets.VITE_AI_PROXY_URL }}
          AI_BASE_URL: ${{ vars.VITE_AI_BASE_URL || 'https://api.groq.com/openai/v1' }}
          AI_MODEL: ${{ vars.VITE_AI_MODEL || 'llama-3.3-70b-versatile' }}
        run: |
          set -euo pipefail
          # 生成AIの設定は、AI を有効にしたときだけビルドに渡す(蓋閉じ中に API キーが JS に埋め込まれないように)
          if [ "$VITE_ENABLE_AI" = true ]; then
            export VITE_AI_API_KEY="$AI_API_KEY" VITE_AI_PROXY_URL="$AI_PROXY_URL" VITE_AI_BASE_URL="$AI_BASE_URL" VITE_AI_MODEL="$AI_MODEL"
            echo "生成AIの機能: 有効"
          else
            echo "生成AIの機能: 蓋閉じ(非表示・外部送信なし)"
          fi
          unset AI_API_KEY AI_PROXY_URL
          npm ci --no-audit --no-fund
          npm run "$BUILD_SCRIPT"
          [ "$BUILD_SCRIPT" = build ] || OUTPUT_DIR="dist-${BUILD_SCRIPT#build:}"
          echo "OUTPUT_DIR=$OUTPUT_DIR" >> "$GITHUB_ENV"

      - name: 配備物を組み立てる
        run: |
          set -euo pipefail
          [ -f "$OUTPUT_DIR/index.html" ] || { echo "::error::$OUTPUT_DIR/index.html がありません"; exit 1; }
          rm -rf deploy_out; mkdir -p deploy_out
          cp -a server/server.js server/import.js server/status.js server/package.json server/package-lock.json server/lib deploy_out/
          (cd deploy_out && npm ci --omit=dev --no-audit --no-fund)
          cp -a "$OUTPUT_DIR" deploy_out/public
          # 秘密情報が配備物に混ざらないように .env 系は除く
          find deploy_out -name '.env*' -type f -delete
          node -p '"Node " + process.version + " / ABI " + process.versions.modules' | tee deploy_out/.node-abi
          du -sh deploy_out

      - name: SSH 設定
        env:
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
            echo "SSH_OPTS=-p ${VPS_PORT:-22} -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"
          else
            echo "SSH_OPTS=-p ${VPS_PORT:-22} -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"
          fi

      - name: VPS の確認(Node 構成か・Node のバージョン)
        env:
          REMOTE: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          read -ra O <<< "$SSH_OPTS"
          # 静的配信(--spa)のままの VPS に配備すると画面が壊れるため、Node 構成(再起動の権限がある)でなければ中止する
          # shellcheck disable=SC2029  # APP_NAME は手元で展開する
          if ! ssh "${O[@]}" "$REMOTE" "sudo -n -l /usr/bin/systemctl restart app-$APP_NAME" >/dev/null 2>&1; then
            echo "::error::VPS がまだ Node 構成ではありません(app-$APP_NAME を再起動できません)。Mac で scripts/setup-vps.sh を実行してから配備してください"
            exit 1
          fi
          # better-sqlite3 はネイティブモジュールのため、ビルドした Node と VPS の Node のメジャー版が一致している必要がある
          remote_major="$(ssh "${O[@]}" "$REMOTE" 'node -p "process.versions.node.split(\".\")[0]"')"
          local_major="$(node -p 'process.versions.node.split(".")[0]')"
          echo "Node: ビルド $local_major / VPS $remote_major"
          [ "$remote_major" = "$local_major" ] || { echo "::error::VPS の Node($remote_major)とビルドの Node($local_major)のメジャー版が違います"; exit 1; }

      - name: VPS へ転送(rsync)
        env:
          REMOTE: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          rsync -rltz --checksum --delete \
            --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r \
            -e "ssh $SSH_OPTS" deploy_out/ "$REMOTE:/srv/apps/$APP_NAME/app/"

      - name: サービスを再起動
        env:
          REMOTE: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          read -ra O <<< "$SSH_OPTS"
          # sudoers は restart / status app-$APP_NAME だけを許可している
          # shellcheck disable=SC2029  # APP_NAME は手元で展開する
          ssh "${O[@]}" "$REMOTE" "sudo -n /usr/bin/systemctl restart app-$APP_NAME"
          sleep 3
          # shellcheck disable=SC2029  # APP_NAME は手元で展開する
          ssh "${O[@]}" "$REMOTE" "sudo -n /usr/bin/systemctl status app-$APP_NAME --no-pager" | head -n 12

      - name: 公開 URL の疎通確認
        run: |
          if [ -z "$APP_URL" ]; then
            echo "Variables の APP_URL が未設定のため疎通確認をスキップします"; exit 0
          fi
          base="${APP_URL%/}"
          for p in /api/health / /demo /login; do
            curl -fsS -o /dev/null -m 20 --retry 6 --retry-delay 5 --retry-all-errors -w "$base$p -> HTTP %{http_code}\n" "$base$p"
          done

      - name: SSH 鍵を片付ける
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
